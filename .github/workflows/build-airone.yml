name: Build Airone IDE

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with artifacts'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

# ─── Shared Environment Variables ────────────────────────────────────────────
# PlatformIO Core and ESP32 toolchain versions — update these to change the
# bundled offline compilation toolchain.  Users only need Python; everything
# below is downloaded by CI and baked into the installer.
env:
  PLATFORMIO_VERSION: ">=6.1"
  ESP32_PLATFORM_VERSION: "espressif32"

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  #  Windows Build
  # ══════════════════════════════════════════════════════════════════════════
  build-windows:
    name: Windows Build
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Use Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ── PlatformIO + ESP32 Offline Toolchain ───────────────────────────
      # Install PlatformIO Core, then download the ESP32 toolchain packages
      # (compiler + Arduino framework) so they can be bundled inside the
      # Electron app for fully offline compilation.  Users will NOT need to
      # install PlatformIO themselves — only Python is required.
      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Cache ESP32 toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            vendor/platformio_cache
            vendor/platformio_packages
          key: pio-esp32-full-win-v3-${{ hashFiles('theia-extensions/airo/src/node/airo-compiler-service.ts') }}
          restore-keys: |
            pio-esp32-full-win-

      - name: Bundle PlatformIO Core Python packages
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Install PlatformIO Core AND all its Python dependencies into vendor/platformio_packages/
          # At runtime, PYTHONPATH will point here so `python -m platformio` works WITHOUT pip install.
          mkdir -p vendor/platformio_packages
          pip install --target vendor/platformio_packages platformio
          # NOTE: Do NOT remove .dist-info directories — PlatformIO uses importlib.metadata
          # to check its own version, and removing .dist-info causes ImportError at runtime.
          echo "PlatformIO Core packages bundled:"
          ls vendor/platformio_packages/ | head -30
          echo "Total size:"
          du -sh vendor/platformio_packages/

      - name: Download ESP32 toolchain for offline use
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "Downloading ESP32 toolchain packages via PlatformIO..."
          # Create a temporary project to force PlatformIO to download toolchain
          TMPDIR=$(mktemp -d)
          cat > "$TMPDIR/platformio.ini" << 'EOF'
          [env:esp32dev]
          platform = espressif32
          board = esp32dev
          framework = arduino
          EOF
          mkdir -p "$TMPDIR/src"
          echo "void setup() {} void loop() {}" > "$TMPDIR/src/main.cpp"
          pio run -d "$TMPDIR" -e esp32dev || true

          # Determine PlatformIO home directory on Windows
          # GitHub Actions bash on Windows: use $USERPROFILE or $HOME
          PIO_HOME="${USERPROFILE:-$HOME}/.platformio"
          echo "PlatformIO home: $PIO_HOME"

          # Copy the downloaded packages into vendor/
          # These are the compiler toolchain + Arduino framework — they ARE portable
          # (unlike penv which is a Python venv tied to a specific Python installation)
          mkdir -p vendor/platformio_cache/packages

          for pkg in toolchain-xtensa-esp32 framework-arduinoespressif32 tool-esptoolpy tool-mkspiffs tool-mklittlefs; do
            if [ -d "$PIO_HOME/packages/$pkg" ]; then
              cp -r "$PIO_HOME/packages/$pkg" vendor/platformio_cache/packages/
              echo "✓ Copied $pkg"
            else
              echo "⚠ $pkg not found at $PIO_HOME/packages/$pkg"
            fi
          done

          # Copy platforms directory (contains platform metadata for espressif32)
          if [ -d "$PIO_HOME/platforms" ]; then
            cp -r "$PIO_HOME/platforms" vendor/platformio_cache/
            echo "✓ Copied PlatformIO platforms"
          fi

          # NOTE: We do NOT copy penv (PlatformIO's Python virtualenv).
          # penv is tied to the CI machine's Python path and is NOT portable.
          # Instead, PlatformIO Core Python packages are bundled via pip install --target
          # into vendor/platformio_packages/ (see the "Bundle PlatformIO Core" step above).
          # At runtime, PYTHONPATH points to vendor/platformio_packages/ so
          # `python -m platformio` works without any pip install on the user's machine.
          # PLATFORMIO_CORE_DIR points to vendor/platformio_cache/ for the toolchain.

          echo "=== Vendor directory contents ==="
          du -sh vendor/platformio_cache/packages/* || echo "No packages"
          echo "Total vendor size:"
          du -sh vendor/platformio_cache || echo "No vendor"

      - name: Download and bundle Arduino libraries
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Download ALL Arduino libraries used by .airo sketches.
          # These are placed in vendor/platformio_cache/lib/ so PlatformIO
          # can find them via lib_extra_dirs without downloading at runtime.
          #
          # PlatformIO's lib_extra_dirs expects each library in its own subdirectory
          # with a library.properties or library.json manifest at the root.
          # `pio pkg install -g -l <lib>` downloads to ~/.platformio/lib/
          # in the correct format for lib_extra_dirs.
          echo "Downloading Arduino libraries for offline use..."
          mkdir -p vendor/platformio_cache/lib

          # List of all libraries used by .airo transpiler:
          # - WebSockets (for body/comm/wifi.airo)
          # - ArduinoJson (for body/comm/wifi.airo)
          # - ESP32Servo (for body/actuation/servo.airo)
          # - esp32-camera (for body/sight/eyes.airo)
          LIBRARIES="WebSockets ArduinoJson ESP32Servo esp32-camera"

          for lib in $LIBRARIES; do
            echo "  Downloading library: $lib"
            pio pkg install -g -l "$lib" 2>&1 || echo "  ⚠ Failed to download $lib (non-critical)"
          done

          # Copy libraries from PlatformIO's global lib dir to vendor
          PIO_HOME="${USERPROFILE:-$HOME}/.platformio"
          if [ -d "$PIO_HOME/lib" ]; then
            # Copy each library directory (skip the common .pio directory if present)
            for lib_dir in "$PIO_HOME/lib"/*/; do
              lib_name=$(basename "$lib_dir")
              if [ "$lib_name" != ".pio" ] && [ "$lib_name" != "__pycache__" ]; then
                cp -r "$lib_dir" "vendor/platformio_cache/lib/"
                echo "  ✓ Copied library: $lib_name"
              fi
            done
          else
            echo "  ⚠ PlatformIO global lib dir not found at $PIO_HOME/lib"
          fi

          echo "=== Bundled libraries ==="
          ls vendor/platformio_cache/lib/ || echo "No libraries bundled"
          echo "Total library size:"
          du -sh vendor/platformio_cache/lib/ || echo "No lib dir"

      - name: Verify offline toolchain
        shell: bash
        run: |
          echo "Verifying bundled toolchain..."
          if [ -d "vendor/platformio_cache/packages/toolchain-xtensa-esp32" ]; then
            echo "✓ toolchain-xtensa-esp32 present"
          else
            echo "⚠ toolchain-xtensa-esp32 MISSING — offline compilation may not work"
          fi
          if [ -d "vendor/platformio_cache/packages/framework-arduinoespressif32" ]; then
            echo "✓ framework-arduinoespressif32 present"
          else
            echo "⚠ framework-arduinoespressif32 MISSING — offline compilation may not work"
          fi
          if [ -d "vendor/platformio_packages/platformio" ]; then
            echo "✓ PlatformIO Core Python packages present"
          else
            echo "⚠ PlatformIO Core Python packages MISSING — offline compilation may not work"
          fi
          echo "Verifying bundled libraries..."
          if [ -d "vendor/platformio_cache/lib" ] && [ "$(ls vendor/platformio_cache/lib/ 2>/dev/null)" ]; then
            echo "✓ Arduino libraries present:"
            ls vendor/platformio_cache/lib/
          else
            echo "⚠ Arduino libraries MISSING — offline compilation may not work"
          fi

      # ── Build the IDE ──────────────────────────────────────────────────
      - name: Install airo_compiler (optional)
        shell: bash
        run: pip install airo-compiler 2>/dev/null || echo "airo_compiler not available on PyPI yet, using built-in TypeScript verifier"
        continue-on-error: true

      - name: Install dependencies
        shell: bash
        run: yarn --skip-integrity-check --network-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Electron binary
        shell: bash
        run: |
          echo "Ensuring Electron binary is available..."
          if [ -f "node_modules/electron/dist/version" ]; then
            echo "Electron binary already exists: $(cat node_modules/electron/dist/version)"
          else
            echo "Electron binary not found, downloading directly..."
            mkdir -p node_modules/electron/dist
            VERSION="v39.8.7"
            FILE="electron-${VERSION}-win32-x64.zip"
            URL="https://github.com/electron/electron/releases/download/${VERSION}/${FILE}"
            echo "Downloading ${URL}..."
            curl -L --retry 3 -o /tmp/electron.zip "${URL}"
            echo "Extracting..."
            unzip -o /tmp/electron.zip -d node_modules/electron/dist
            echo "39.8.7" > node_modules/electron/dist/version
            echo "Downloaded Electron ${VERSION}"
          fi
          echo "Final Electron version: $(cat node_modules/electron/dist/version 2>/dev/null || echo 'FAILED')"

      - name: Build extensions
        shell: bash
        run: yarn build:extensions
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Build application
        shell: bash
        run: yarn build:applications
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download plugins
        shell: bash
        run: yarn download:plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows
        shell: bash
        run: yarn package:applications
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist contents
        shell: bash
        run: |
          echo "=== Dist directory contents ==="
          ls -la applications/electron/dist/ 2>/dev/null || echo "dist dir not found"
          echo "=== Looking for latest.yml ==="
          find applications/electron/dist -name "latest*.yml" -type f 2>/dev/null || echo "No yml files found"

      - name: Generate latest.yml if missing
        shell: bash
        run: |
          DIST_DIR="applications/electron/dist"
          if [ ! -f "${DIST_DIR}/latest.yml" ]; then
            echo "latest.yml not found, generating it..."
            EXE_FILE=$(ls ${DIST_DIR}/*.exe 2>/dev/null | head -1)
            if [ -n "$EXE_FILE" ]; then
              EXE_NAME=$(basename "$EXE_FILE")
              EXE_SIZE=$(stat -c%s "$EXE_FILE" 2>/dev/null || wc -c < "$EXE_FILE")
              SHA512=$(sha512sum "$EXE_FILE" | cut -d' ' -f1)
              cat > "${DIST_DIR}/latest.yml" << EOF
          version: $(node -p "require('./applications/electron/package.json').version")
          files:
            - url: ${EXE_NAME}
              sha512: ${SHA512}
              size: ${EXE_SIZE}
          path: ${EXE_NAME}
          sha512: ${SHA512}
          releaseDate: '$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")'
          EOF
              echo "Generated latest.yml:"
              cat "${DIST_DIR}/latest.yml"
            else
              echo "WARNING: No exe file found in dist directory"
            fi
          else
            echo "latest.yml already exists:"
            cat "${DIST_DIR}/latest.yml"
          fi

      - name: Upload Windows Installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AironeIDE-Windows
          path: |
            applications/electron/dist/*.exe
            applications/electron/dist/*.blockmap
            applications/electron/dist/latest.yml
          retention-days: 30

      - name: Upload Windows Installer (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AironeIDE-Windows-PR
          path: |
            applications/electron/dist/*.exe
          retention-days: 5

  # ══════════════════════════════════════════════════════════════════════════
  #  Linux Build
  # ══════════════════════════════════════════════════════════════════════════
  build-linux:
    name: Linux Build
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbfile-dev libx11-dev libsecret-1-dev libfontconfig1

      - name: Use Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ── PlatformIO + ESP32 Offline Toolchain ───────────────────────────
      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Cache ESP32 toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            vendor/platformio_cache
            vendor/platformio_packages
          key: pio-esp32-full-linux-v3-${{ hashFiles('theia-extensions/airo/src/node/airo-compiler-service.ts') }}
          restore-keys: |
            pio-esp32-full-linux-

      - name: Bundle PlatformIO Core Python packages
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Install PlatformIO Core AND all its Python dependencies into vendor/platformio_packages/
          # At runtime, PYTHONPATH will point here so `python -m platformio` works WITHOUT pip install.
          mkdir -p vendor/platformio_packages
          pip install --target vendor/platformio_packages platformio
          # NOTE: Do NOT remove .dist-info directories — PlatformIO uses importlib.metadata
          # to check its own version, and removing .dist-info causes ImportError at runtime.
          echo "PlatformIO Core packages bundled:"
          ls vendor/platformio_packages/ | head -30
          echo "Total size:"
          du -sh vendor/platformio_packages/

      - name: Download ESP32 toolchain for offline use
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "Downloading ESP32 toolchain packages via PlatformIO..."
          # Create a temporary project to force PlatformIO to download toolchain
          TMPDIR=$(mktemp -d)
          cat > "$TMPDIR/platformio.ini" << 'EOF'
          [env:esp32dev]
          platform = espressif32
          board = esp32dev
          framework = arduino
          EOF
          mkdir -p "$TMPDIR/src"
          echo "void setup() {} void loop() {}" > "$TMPDIR/src/main.cpp"
          pio run -d "$TMPDIR" -e esp32dev || true

          # Copy the downloaded packages into vendor/
          # These are the compiler toolchain + Arduino framework — they ARE portable
          # (unlike penv which is a Python venv tied to a specific Python installation)
          mkdir -p vendor/platformio_cache/packages
          PIO_HOME="$HOME/.platformio"

          for pkg in toolchain-xtensa-esp32 framework-arduinoespressif32 tool-esptoolpy tool-mkspiffs tool-mklittlefs; do
            if [ -d "$PIO_HOME/packages/$pkg" ]; then
              cp -r "$PIO_HOME/packages/$pkg" vendor/platformio_cache/packages/
              echo "✓ Copied $pkg"
            else
              echo "⚠ $pkg not found at $PIO_HOME/packages/$pkg"
            fi
          done

          # Copy platforms directory (contains platform metadata for espressif32)
          if [ -d "$PIO_HOME/platforms" ]; then
            cp -r "$PIO_HOME/platforms" vendor/platformio_cache/
            echo "✓ Copied PlatformIO platforms"
          fi

          echo "=== Vendor directory contents ==="
          du -sh vendor/platformio_cache/packages/* || echo "No packages"
          echo "Total vendor size:"
          du -sh vendor/platformio_cache || echo "No vendor"

      - name: Download and bundle Arduino libraries
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          # Download ALL Arduino libraries used by .airo sketches.
          # These are placed in vendor/platformio_cache/lib/ so PlatformIO
          # can find them via lib_extra_dirs without downloading at runtime.
          echo "Downloading Arduino libraries for offline use..."
          mkdir -p vendor/platformio_cache/lib

          # List of all libraries used by .airo transpiler:
          # - WebSockets (for body/comm/wifi.airo)
          # - ArduinoJson (for body/comm/wifi.airo)
          # - ESP32Servo (for body/actuation/servo.airo)
          # - esp32-camera (for body/sight/eyes.airo)
          LIBRARIES="WebSockets ArduinoJson ESP32Servo esp32-camera"

          for lib in $LIBRARIES; do
            echo "  Downloading library: $lib"
            pio pkg install -g -l "$lib" 2>&1 || echo "  ⚠ Failed to download $lib (non-critical)"
          done

          # Copy libraries from PlatformIO's global lib dir to vendor
          PIO_HOME="$HOME/.platformio"
          if [ -d "$PIO_HOME/lib" ]; then
            for lib_dir in "$PIO_HOME/lib"/*/; do
              lib_name=$(basename "$lib_dir")
              if [ "$lib_name" != ".pio" ] && [ "$lib_name" != "__pycache__" ]; then
                cp -r "$lib_dir" "vendor/platformio_cache/lib/"
                echo "  ✓ Copied library: $lib_name"
              fi
            done
          else
            echo "  ⚠ PlatformIO global lib dir not found at $PIO_HOME/lib"
          fi

          echo "=== Bundled libraries ==="
          ls vendor/platformio_cache/lib/ || echo "No libraries bundled"
          echo "Total library size:"
          du -sh vendor/platformio_cache/lib/ || echo "No lib dir"

      - name: Verify offline toolchain
        run: |
          echo "Verifying bundled toolchain..."
          if [ -d "vendor/platformio_cache/packages/toolchain-xtensa-esp32" ]; then
            echo "✓ toolchain-xtensa-esp32 present"
          else
            echo "⚠ toolchain-xtensa-esp32 MISSING — offline compilation may not work"
          fi
          if [ -d "vendor/platformio_cache/packages/framework-arduinoespressif32" ]; then
            echo "✓ framework-arduinoespressif32 present"
          else
            echo "⚠ framework-arduinoespressif32 MISSING — offline compilation may not work"
          fi
          if [ -d "vendor/platformio_packages/platformio" ]; then
            echo "✓ PlatformIO Core Python packages present"
          else
            echo "⚠ PlatformIO Core Python packages MISSING — offline compilation may not work"
          fi
          echo "Verifying bundled libraries..."
          if [ -d "vendor/platformio_cache/lib" ] && [ "$(ls vendor/platformio_cache/lib/ 2>/dev/null)" ]; then
            echo "✓ Arduino libraries present:"
            ls vendor/platformio_cache/lib/
          else
            echo "⚠ Arduino libraries MISSING — offline compilation may not work"
          fi

      # ── Build the IDE ──────────────────────────────────────────────────
      - name: Install airo_compiler (optional)
        run: pip install airo-compiler 2>/dev/null || echo "airo_compiler not available on PyPI yet, using built-in TypeScript verifier"
        continue-on-error: true

      - name: Install dependencies
        shell: bash
        run: yarn --skip-integrity-check --network-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Electron binary
        shell: bash
        run: |
          echo "Ensuring Electron binary is available..."
          if [ -f "node_modules/electron/dist/version" ]; then
            echo "Electron binary already exists: $(cat node_modules/electron/dist/version)"
          else
            echo "Electron binary not found, downloading directly..."
            mkdir -p node_modules/electron/dist
            VERSION="v39.8.7"
            FILE="electron-${VERSION}-linux-x64.zip"
            URL="https://github.com/electron/electron/releases/download/${VERSION}/${FILE}"
            echo "Downloading ${URL}..."
            curl -L --retry 3 -o /tmp/electron.zip "${URL}"
            echo "Extracting to node_modules/electron/dist..."
            unzip -o /tmp/electron.zip -d node_modules/electron/dist
            echo "39.8.7" > node_modules/electron/dist/version
            echo "Downloaded Electron ${VERSION}"
          fi
          echo "Final Electron version: $(cat node_modules/electron/dist/version 2>/dev/null || echo 'FAILED')"

      - name: Build extensions
        shell: bash
        run: yarn build:extensions
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Build application
        shell: bash
        run: yarn build:applications
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download plugins
        shell: bash
        run: yarn download:plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Linux
        shell: bash
        run: yarn package:applications
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist contents
        shell: bash
        run: |
          echo "=== Dist directory contents ==="
          ls -la applications/electron/dist/ 2>/dev/null || echo "dist dir not found"
          echo "=== Looking for latest-linux.yml ==="
          find applications/electron/dist -name "latest*.yml" -type f 2>/dev/null || echo "No yml files found"

      - name: Generate latest-linux.yml if missing
        shell: bash
        run: |
          DIST_DIR="applications/electron/dist"
          if [ ! -f "${DIST_DIR}/latest-linux.yml" ]; then
            echo "latest-linux.yml not found, generating it..."
            APPIMAGE_FILE=$(ls ${DIST_DIR}/*.AppImage 2>/dev/null | head -1)
            if [ -n "$APPIMAGE_FILE" ]; then
              APPIMAGE_NAME=$(basename "$APPIMAGE_FILE")
              APPIMAGE_SIZE=$(stat -c%s "$APPIMAGE_FILE" 2>/dev/null || wc -c < "$APPIMAGE_FILE")
              SHA512=$(sha512sum "$APPIMAGE_FILE" | cut -d' ' -f1)
              cat > "${DIST_DIR}/latest-linux.yml" << EOF
          version: $(node -p "require('./applications/electron/package.json').version")
          files:
            - url: ${APPIMAGE_NAME}
              sha512: ${SHA512}
              size: ${APPIMAGE_SIZE}
          path: ${APPIMAGE_NAME}
          sha512: ${SHA512}
          releaseDate: '$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")'
          EOF
              echo "Generated latest-linux.yml:"
              cat "${DIST_DIR}/latest-linux.yml"
            else
              echo "WARNING: No AppImage file found in dist directory"
            fi
          else
            echo "latest-linux.yml already exists:"
            cat "${DIST_DIR}/latest-linux.yml"
          fi

      - name: Upload Linux AppImage
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AironeIDE-Linux
          path: |
            applications/electron/dist/*.AppImage
            applications/electron/dist/*.deb
            applications/electron/dist/latest-linux.yml
          retention-days: 30

  # ══════════════════════════════════════════════════════════════════════════
  #  Android Build (no PlatformIO — mobile app is browser-only)
  # ══════════════════════════════════════════════════════════════════════════
  build-android:
    name: Android Build
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbfile-dev libx11-dev libsecret-1-dev libfontconfig1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        shell: bash
        run: yarn --skip-integrity-check --network-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build extensions
        shell: bash
        run: yarn build:extensions
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Build browser application
        shell: bash
        run: yarn --cwd applications/browser build:prod
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download plugins
        shell: bash
        run: yarn download:plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Capacitor
        working-directory: applications/browser
        run: npx cap sync android

      - name: Cache Node.js for Android
        id: cache-nodejs
        uses: actions/cache@v4
        with:
          path: /tmp/nodejs-android-assets
          key: nodejs-termux-android-arm64-v1

      - name: Download Node.js from Termux
        if: steps.cache-nodejs.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/download-termux-nodejs.sh
          bash scripts/download-termux-nodejs.sh
          mkdir -p /tmp/nodejs-android-assets
          cp -r applications/browser/android/app/src/main/assets/nodejs /tmp/nodejs-android-assets/

      - name: Restore Node.js from cache
        if: steps.cache-nodejs.outputs.cache-hit == 'true'
        run: |
          echo "Restoring Node.js from cache..."
          mkdir -p applications/browser/android/app/src/main/assets/nodejs
          cp -r /tmp/nodejs-android-assets/nodejs/* applications/browser/android/app/src/main/assets/nodejs/
          echo "Node.js restored from cache"
          ls -la applications/browser/android/app/src/main/assets/nodejs/bin/

      - name: Verify Node.js assets
        run: |
          echo "=== Node.js assets verification ==="
          NODE_BIN="applications/browser/android/app/src/main/assets/nodejs/bin/node"
          if [ -f "$NODE_BIN" ]; then
            echo "✓ Node.js binary found: $(du -h "$NODE_BIN" | cut -f1)"
          else
            echo "✗ Node.js binary NOT found - app will work in remote backend mode"
          fi

      - name: Copy backend files to assets
        run: |
          ASSETS_BACKEND="applications/browser/android/app/src/main/assets/backend"
          mkdir -p "${ASSETS_BACKEND}"
          if [ -d "applications/browser/lib/backend" ]; then
            rsync -a --exclude='*.map' --exclude='.git' --exclude='*.md' \
              applications/browser/lib/backend/ "${ASSETS_BACKEND}/"
            echo "Backend files copied:"
            find "${ASSETS_BACKEND}" -type f | head -20
          else
            echo "# Backend files placeholder" > "${ASSETS_BACKEND}/.gitkeep"
          fi

      - name: Decode keystore
        working-directory: applications/browser
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Decoding keystore..."
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android-signing/airone-ide-release.keystore
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret - building debug APK"
          fi

      - name: Build Android APK
        working-directory: applications/browser/android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Attempting release APK build..."
          if ./gradlew assembleRelease 2>&1; then
            echo "Release APK built successfully"
          else
            echo "Release build failed, building debug APK..."
            ./gradlew assembleDebug
          fi

      - name: Locate and prepare APK
        working-directory: applications/browser
        run: |
          echo "Looking for APK files..."
          find android -name "*.apk" -type f 2>/dev/null
          APK_FILE=$(find android -name "*.apk" -type f | head -1)
          if [ -n "${APK_FILE}" ]; then
            mkdir -p dist
            cp "${APK_FILE}" "dist/AironeIDE.apk"
            echo "APK ready: dist/AironeIDE.apk"
            ls -lh dist/AironeIDE.apk
          else
            echo "ERROR: No APK found!"
            exit 1
          fi

      - name: Upload Android APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AironeIDE-Android
          path: applications/browser/dist/AironeIDE.apk
          retention-days: 30

      - name: Upload Android APK (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AironeIDE-Android-PR
          path: applications/browser/dist/AironeIDE.apk
          retention-days: 5

  # ══════════════════════════════════════════════════════════════════════════
  #  Create GitHub Release
  # ══════════════════════════════════════════════════════════════════════════
  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: AironeIDE-Windows
          path: ./release-artifacts/windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: AironeIDE-Linux
          path: ./release-artifacts/linux

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: AironeIDE-Android
          path: ./release-artifacts/android

      - name: List release artifacts
        run: |
          echo "=== All release artifacts ==="
          find ./release-artifacts -type f | sort

      - name: Verify update metadata files
        run: |
          echo "Checking for latest.yml (Windows auto-update)..."
          if [ -f "./release-artifacts/windows/latest.yml" ]; then
            echo "latest.yml found:"
            cat ./release-artifacts/windows/latest.yml
          else
            echo "latest.yml NOT found - auto-update will NOT work on Windows!"
          fi

          echo ""
          echo "Checking for latest-linux.yml (Linux auto-update)..."
          if [ -f "./release-artifacts/linux/latest-linux.yml" ]; then
            echo "latest-linux.yml found:"
            cat ./release-artifacts/linux/latest-linux.yml
          else
            echo "latest-linux.yml NOT found - auto-update will NOT work on Linux!"
          fi

      - name: Generate version tag
        id: version
        run: |
          VERSION=$(node -p "require('./applications/electron/package.json').version")
          BUILD_NUM=$(date +'%Y%m%d%H%M')
          TAG="v${VERSION}-build.${BUILD_NUM}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building release: ${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Airone IDE ${{ steps.version.outputs.tag }}"
          body: |
            ## Airone IDE ${{ steps.version.outputs.tag }}

            ### Downloads
            - **Windows**: `AironeIDESetup.exe` — Windows installer (NSIS)
            - **Linux**: `AironeIDE.AppImage` — Portable AppImage
            - **Linux**: `AironeIDE.deb` — Debian/Ubuntu package
            - **Android**: `AironeIDE.apk` — Android app (signed)

            ### Offline Compilation
            The Windows and Linux installers include the **full PlatformIO Core + ESP32 toolchain** (Xtensa compiler, Arduino framework, esptool) bundled inside. **No internet connection and no pip install is needed to compile .airo code.** The only prerequisite is **Python 3.8+** installed on the user's machine. PlatformIO runs directly from the bundled Python packages.

            ### Android App
            The Android app bundles a pre-built Node.js runtime (from Termux) and the Theia backend.
            On launch, the backend starts automatically and the full IDE loads from `localhost:3000`.

            **Features:**
            - Full Theia IDE running locally on your device
            - Code editor with syntax highlighting for .airo files
            - File management (create, edit, save files)
            - Serial port communication (USB OTG)
            - No network connection required

            **Installation:**
            1. Download `AironeIDE.apk` on your Android device
            2. Enable "Install from unknown sources" in Android Settings → Security
            3. Open the APK file to install

            ### Changes
            See commit history for changes since the last release.
          draft: false
          prerelease: false
          files: |
            ./release-artifacts/windows/*
            ./release-artifacts/linux/*
            ./release-artifacts/android/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
