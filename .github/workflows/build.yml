name: Build & Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  # GH_TOKEN for authenticated GitHub API access (higher rate limits: 5000 vs 60 req/hr)
  # Used by electron-updater, electron-builder, and npm/git operations
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          # GH_TOKEN increases rate limit for GitHub API calls during npm install
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Theia
        run: yarn build

      - name: Package Electron App (dir)
        run: |
          cd applications/electron
          yarn electron-builder --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate app-update.yml (Windows)
        if: matrix.platform == 'win'
        run: node applications/electron/scripts/generate-app-update-yml.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Distributable
        run: |
          cd applications/electron
          yarn electron-builder --prepackaged dist/win-unpacked
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airone-ide-${{ matrix.platform }}
          path: |
            applications/electron/dist/*.exe
            applications/electron/dist/*.dmg
            applications/electron/dist/*.zip
            applications/electron/dist/*.deb
            applications/electron/dist/*.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
